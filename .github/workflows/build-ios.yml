name: Build iOS (iPhone 6s Plus)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'iosApp/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Compile & Package IPA for iPhone 6s Plus
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Create Build Directories
        run: mkdir -p build

      - name: Build and Archive iOS App
        run: |
          xcodebuild \
            -project iosApp/HabitFlow.xcodeproj \
            -scheme HabitFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HabitFlow.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/HabitFlow.xcarchive/Products/Applications/HabitFlow.app build/Payload/
          cd build && zip -r HabitFlow.ipa Payload/
          ls -lh HabitFlow.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-iOS-iPhone6sPlus
          path: build/HabitFlow.ipa
          retention-days: 14
